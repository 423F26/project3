<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Level 2</h1>
    <button><a href="index.html">Back to the home page</a></button>

        <button id="reward-button">I did it!</button>
    <div id="reward-container">
        <h2>You unlocked a new character!</h2>
        <div id="character"><img src="Level2-Penguin.png"></div>
    </div>

    <div id = 'gamescreen'>
        <div id="penguin"><img src="Level2-Penguin.png"></div>
    </div>
    

    <input type="text" id="commandInput" placeholder="Enter a command">
    <button id="submitButton">Submit</button>

    <script>
        const button = document.getElementById('reward-button');
        const rewardContainer = document.getElementById('reward-container');
        button.addEventListener('click', () => {
            rewardContainer.style.display = 'block';

            button.disabled = true;
            button.innerText = "Reward unlocked!";

        });

        let posX = 180;
        let posY = 180;
        const stepSize = 30;

        const penguin = document.getElementById('penguin');
        const commandInput = document.getElementById('commandInput');
        const submitButton = document.getElementById('submitButton');

        function movePenguin(direction) {
            const command = direction.toLowerCase().trim();
  
            switch (command) {
                case 'up':
                    posY -= stepSize;
                    break;
                case 'down':
                    posY += stepSize;
                    break;
                case 'left':
                    posX -= stepSize;
                    break;
                case 'right':
                    posX += stepSize;
                    break;

                default:
                    break;
            }
            penguin.style.left = posX + 'px';
            penguin.style.top = posY + 'px';

            commandInput.value = '';
        }

        submitButton.addEventListener('click', () => {
            movePenguin(commandInput.value);
        });
        commandInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                movePenguin(commandInput.value);
            }
        });

        

    </script>

    <style>
        #penguin{
            position: absolute;
            width: 60px;
            height: 60px;
            object-fit: contain;
            transition: left 0.15s, top 0.15s;
        }
        #gamescreen{
            position: relative;
            width: 500px;
            height: 600px;
            border: 1px solid black;
            overflow: hidden;
        }
        #penguin img{
            width: 100px;
            height: auto;
        }
    </style>

    
</body>
</html>
